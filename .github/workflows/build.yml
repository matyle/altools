name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # Homepage-only changes deploy through pages.yml and need no app build or release.
    paths-ignore: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Test
        run: swift test

      - name: Install dmgbuild
        run: |
          python3 -m venv "$RUNNER_TEMP/dmg"
          "$RUNNER_TEMP/dmg/bin/pip" install --quiet dmgbuild
          echo "$RUNNER_TEMP/dmg/bin" >> "$GITHUB_PATH"

      # No signing certificate on the runner, so the app is signed ad-hoc: macOS asks for
      # Accessibility and Screen Recording again after each install.
      - name: Build app and disk image
        run: scripts/build-app.sh release dmg

      - name: Package
        run: |
          ditto -c -k --keepParent build/Altools.app Altools.zip
          cp build/Altools.dmg Altools.dmg

      - uses: actions/upload-artifact@v4
        with:
          name: Altools
          path: |
            Altools.dmg
            Altools.zip

      - name: Release version tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Altools.dmg Altools.zip --generate-notes

      # Every push to main publishes a build release; only the newest 10 are kept.
      - name: Release main build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" Altools.dmg Altools.zip --target "$GITHUB_SHA" --latest \
            --title "Build ${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" --generate-notes
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("build-"))] | sort_by(.createdAt) | reverse | .[10:] | .[].tagName' |
            while read -r old; do gh release delete "$old" --yes --cleanup-tag; done
